# yaml-language-server: $schema=./quartz/quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Notes
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: false
  analytics: null
  locale: en-US
  baseUrl: dev.skbuff.cc
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Noto Sans JP
      body: Noto Sans JP
      code: IBM Plex Mono
    # Catppuccin Latte and Mocha: https://catppuccin.com/palette/
    colors:
      lightMode:
        light: "#eff1f5"
        lightgray: "#ccd0da"
        gray: "#5c5f77"
        darkgray: "#4c4f69"
        dark: "#4c4f69"
        secondary: "#8839ef"
        tertiary: "#4c4f69"
        highlight: "#e6e9ef"
        textHighlight: "#ccd0da"
      darkMode:
        light: "#1e1e2e"
        lightgray: "#313244"
        gray: "#a6adc8"
        darkgray: "#bac2de"
        dark: "#cdd6f4"
        secondary: "#cba6f7"
        tertiary: "#89b4fa"
        highlight: "#313244"
        textHighlight: "#45475a"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: catppuccin-latte
        dark: catppuccin-mocha
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: googleFonts
      header:
        name: Noto Sans JP
        weights: [400, 500]
      body:
        name: Noto Sans JP
        weights: [300, 400, 500, 600]
        includeItalic: false
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/search"
    enabled: true
    options:
      enablePreview: false
    layout:
      position: beforeBody
      priority: 20
      group: titlebar
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      group: titlebar
      groupOptions:
        grow: true
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 11
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      group: titlebar
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/recent-notes"
    enabled: true
    options: &articleList
      title: ""
      limit: .inf
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: left
      priority: 50
      display: desktop-only
  - source: "@quartz-community/recent-notes"
    enabled: true
    options: *articleList
    layout:
      position: afterBody
      priority: 50
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      hidePropertiesView: true
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    titlebar:
      priority: 10
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder: {}
    tag: {}
    canvas: {}
    bases: {}
